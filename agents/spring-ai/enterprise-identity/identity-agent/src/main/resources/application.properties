# The port dev-enterprise-identity.yaml connects Catalyst to, and the one the README's curls and
# test.http target. APP_PORT is set there so the two cannot drift.
server.port=${APP_PORT:8006}

# The Dapr app-id. It must equal the appID in the dev-run file, or the access policy in
# resources/crm-mcp-access.yaml names a caller that does not exist and the CRM refuses the agent.
spring.application.name=identity-agent

# Java 21 virtual threads: a blocking ChatClient.call() parks a virtual thread instead of a platform
# one. The identity token is a ThreadLocal, and a virtual thread is still one thread per request, so
# this changes nothing about the caller reaching the outbound MCP call.
spring.threads.virtual.enabled=true

# ── LLM: canned offline by default, OpenAI on request ────────────────────────
# Selects the chat model. Anything other than "openai" uses the canned offline model, which is what
# makes this quickstart runnable with no account — see CannedChatModel.
spring.ai.model.chat=${DIAGRID_QUICKSTART_MODEL:none}

# Only read when the above is "openai". To use a real provider:
#
#   export OPENAI_API_KEY=sk-...
#   export DIAGRID_QUICKSTART_MODEL=openai
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.model=gpt-4o-mini

# ── Logging ──────────────────────────────────────────────────────────────────
# DEBUG here also prints the two thread names the outbound on-behalf-of hand-off crosses: the
# request thread the caller is read on, and the transport thread the header is set on. See
# CatalystMcpClient.
logging.level.io.diagrid.quickstart.springai=INFO

# There is deliberately no spring-boot-starter-actuator here. Every route answers 401 until a
# verified credential arrives, which is why the dev-run file sets enableAppHealthCheck: false.

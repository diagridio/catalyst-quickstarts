# The port resources/crm-mcp.yaml points Catalyst's MCP proxy at, and the one
# dev-enterprise-identity.yaml runs this app on.
server.port=${APP_PORT:8007}

spring.application.name=crm-mcp

# ── MCP server ───────────────────────────────────────────────────────────────
spring.ai.mcp.server.name=crm

# Streamable HTTP, which is the transport resources/crm-mcp.yaml registers
# (spec.endpoint.streamableHTTP). Stated rather than left to the default because Spring AI's SSE
# auto-configuration also contributes a transport provider, and two of them in one context fails
# startup with "expected single matching bean" — see CrmServerApplication, which declares the
# streamable provider itself in order to give it a context extractor.
spring.ai.mcp.server.protocol=streamable

# The endpoint resources/crm-mcp.yaml points Catalyst at is http://localhost:8007/mcp, so this path
# is part of that contract rather than a preference. It is also the default, stated here because the
# resource YAML has no way to discover it.
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

logging.level.io.diagrid.quickstart.springai=INFO

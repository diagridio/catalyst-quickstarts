server.port=8080
# The Dapr app-id (set here and in the dev-run file). Keep it stable across restarts so a resumed
# workflow belongs to the same app.
spring.application.name=spring-ai-event-planner

# Java 21 virtual threads: a blocking ChatClient.call() (an HTTP call to the model, or a durable
# workflow) parks a virtual thread instead of a platform one.
spring.threads.virtual.enabled=true

# ── Durability (diagrid-spring-ai) ──────────────────────────────────────────────
# Each ChatClient.call() runs as a Dapr Workflow. On Catalyst the workflow state store is managed for
# you (no component YAML needed). These are the defaults, shown for clarity. completion-timeout is the
# wait budget for the blocking call; if it elapses the workflow keeps running and the call throws
# DurableCallTimeoutException with the instance id.
diagrid.spring-ai.enabled=true
diagrid.spring-ai.completion-timeout=5m

# ── Agent registry ───────────────────────────────────────────────────────────
# The App ID this agent is recorded under (registration ships in the starter). It must equal
# spring.application.name above and the appID in the dev-run file, or Catalyst drops the record with
# no error logged anywhere.
diagrid.spring-ai.registry.app-id=spring-ai-event-planner

# ── LLM: canned offline by default, OpenAI on request ────────────────────────
# Which chat model auto-configures. Spring AI's OpenAiChatAutoConfiguration is conditional on this
# property being "openai" OR ABSENT, so it must be set to something here: left unset, OpenAI would
# auto-configure and CannedModelConfig's complementary condition would not, giving a context with no
# ChatModel bean at all. Anything other than "openai" selects the canned offline model, which is
# what makes this quickstart runnable with no account — see CannedChatModel.
spring.ai.model.chat=${DIAGRID_QUICKSTART_MODEL:none}

# Only read when the above is "openai". The default keeps startup working without it: Spring AI's
# OpenAI properties are validated eagerly, so a bare ${OPENAI_API_KEY} placeholder fails the whole
# context with an unresolvable-placeholder error before the canned model's condition is ever
# evaluated. To use a real provider:
#
#   export OPENAI_API_KEY=sk-...
#   export DIAGRID_QUICKSTART_MODEL=openai
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.model=gpt-4o-mini

logging.level.io.diagrid.quickstart.springai=INFO
# Quiet the Dapr Workflow engine's internal chatter (per-request WIRETRACE, activity dispatch, runtime
# registration) so the demo shows just the agent's own logs. The durabletask SDK logs these at INFO.
logging.level.io.dapr.durabletask=WARN
logging.level.io.dapr.workflows=WARN

server.port=8080
# The Dapr app-id (set here and in the dev-run file). Keep it stable across restarts so a resumed
# workflow belongs to the same app.
spring.application.name=spring-ai-crash-recovery

# Java 21 virtual threads: the blocking ChatClient.call() (it waits ~30s on the slow tool) parks a
# virtual thread instead of a platform one.
spring.threads.virtual.enabled=true

# ── Durability (diagrid-spring-ai) ──────────────────────────────────────────────
# Each ChatClient.call() runs as a Dapr Workflow. On Catalyst the workflow state store is managed for
# you (no component YAML needed). completion-timeout is the wait budget for the blocking call: kept
# generous (> the slow tool's ~30s) so the first /crash/run blocks through the crash window. If it
# elapses the workflow keeps running and the call throws DurableCallTimeoutException with the instance
# id: re-issue the same id to attach.
diagrid.spring-ai.enabled=true
diagrid.spring-ai.completion-timeout=2m

# ── Agent registry ───────────────────────────────────────────────────────────
# On 0.2.0 the starter records this ChatClient bean (crashRecoveryAgent) as a Catalyst agent. Pin the
# App ID (= spring.application.name above and the dev-run appID) so it is recorded under the right id.
diagrid.spring-ai.registry.app-id=spring-ai-crash-recovery

# How long commitReservation "commits" for: the window in which you kill the app.
crash-recovery.delay-seconds=30

# ── LLM ──────────────────────────────────────────────────────────────────────
# Canned by default: this quickstart is about durable execution, not model quality, so it ships an
# offline model (CannedChatModel) and needs no account. Set DIAGRID_QUICKSTART_MODEL=openai and
# export OPENAI_API_KEY to run it against a real provider instead.
#
# This property is Spring AI's own switch: its OpenAI chat auto-configuration is conditional on the
# value naming `openai` (defaulting to on when absent), so `none` turns it off. CannedModelConfig
# supplies the ChatModel for every value that does not, which keeps the two conditions exhaustive so
# that exactly one ChatModel bean always exists. See CannedModelConfig for why that matters.
spring.ai.model.chat=${DIAGRID_QUICKSTART_MODEL:none}
# Needs a default, and a non-empty one. The OpenAI starter also ships embedding, image, audio and
# moderation auto-configurations that bind this property whatever spring.ai.model.chat says, so
# without a default Spring fails placeholder resolution and the app never starts. `not-set` names
# itself in whatever error it does reach. The trade-off: on the opt-in path a forgotten key no
# longer stops the app booting, and instead fails the model activity at request time.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.model=gpt-4o-mini

logging.level.io.diagrid.quickstart.springai=INFO
# Quiet the Dapr Workflow engine's internal chatter (per-request WIRETRACE, activity dispatch, runtime
# registration) so the demo shows just the agent's own logs. The durabletask SDK logs these at INFO.
logging.level.io.dapr.durabletask=WARN
logging.level.io.dapr.workflows=WARN

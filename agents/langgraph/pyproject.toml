[project]
name = "langgraph-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "diagrid[langgraph]==0.4.3",
    "langchain-openai==1.2.1",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# test_*.py only. crash_test.py matches pytest's other default glob, *_test.py, and
# importing it builds a Dapr-connected runner and client at module level. Naming the
# pattern here also means a new test_*.py file starts running without a CI edit.
python_files = ["test_*.py"]

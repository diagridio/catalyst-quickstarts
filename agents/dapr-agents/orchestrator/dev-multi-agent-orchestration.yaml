version: 1
common:
  appLogDestination: console
  resourcesPath: ./resources
  enableAppHealthCheck: false
  logLevel: info
apps:
  - appID: entertainment-planner
    appDirPath: ../../adk
    appPort: 8001
    appProtocol: http
    command: ["uv", "run", "python", "main.py"]
    env:
      APP_PORT: "8001"

  - appID: venue-scout
    appDirPath: ../../crewai
    appPort: 8002

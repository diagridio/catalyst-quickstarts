[project]
name = "langgraph-identity-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    # The base package, not diagrid[langgraph]. diagrid.identity ships in the
    # base and needs no extra; the langgraph extra pulls the Diagrid agent
    # runner, which this quickstart deliberately does not use.
    "diagrid==0.4.5",
    "langgraph>=1.1.10",
    "langchain-core>=1.3.2",
    # Only imported when DIAGRID_QUICKSTART_MODEL=openai.
    "langchain-openai==1.2.1",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    # diagrid.identity imports jwt and httpx, but diagrid 0.4.5 declares neither
    # and ships no identity extra. They resolve today only because other
    # packages in the graph happen to require them. Declared here so a change
    # upstream cannot quietly break this app. The [crypto] extra brings
    # cryptography, which local_identity.py needs to sign RS256 offline.
    "pyjwt[crypto]>=2.13.0",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# test_*.py only, dropping pytest's other default glob, *_test.py. The workflow
# .github/workflows/agents_langgraph_identity_python.yaml names no file, so
# naming the pattern here means a new test_*.py file starts running without a CI
# edit.
python_files = ["test_*.py"]

version: 1
common:
  appLogDestination: console
  # false because every route answers 401 until a verified credential arrives.
  # `require_auth` is app-wide with no per-path exclusion, so this quickstart
  # exposes no health route and an unauthenticated probe could only ever see the
  # 401 -- a health check would report a perfectly healthy app as down.
  enableAppHealthCheck: false
  logLevel: info
apps:
  - appID: identity-agent
    appDirPath: ./
    appPort: 8006
    appProtocol: http
    command: ["go", "run", "."]
    env:
      APP_PORT: "8006"
      # A go.work file in a parent directory would otherwise pull this module
      # into someone else's workspace and resolve its dependencies from there.
      GOWORK: "off"
  - appID: crm-mcp
    appDirPath: ./
    appPort: 8007
    appProtocol: http
    command: ["go", "run", "./crm"]
    env:
      APP_PORT: "8007"
      GOWORK: "off"

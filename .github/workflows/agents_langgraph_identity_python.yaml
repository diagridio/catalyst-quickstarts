name: python langgraph identity agent quickstart

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agents_langgraph_identity_python.yaml
      - agents/langgraph-identity/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agents_langgraph_identity_python.yaml
      - agents/langgraph-identity/**

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    if: github.repository_owner == 'diagridio'
    steps:
      - uses: actions/checkout@v3
      - uses: astral-sh/setup-uv@v4

      # pytest is an ephemeral dependency on purpose. Adding it to
      # pyproject.toml would force a uv.lock regeneration, and a stale lock
      # fails "uv sync --frozen" in the quickstart's Dockerfile. --frozen here
      # makes this job a guard on that: it fails rather than re-resolving.
      #
      # No filename: pyproject.toml pins python_files to test_*.py, so every test
      # file in the directory runs and a new one needs no edit here.
      #
      # No credentials and no network: the tests stand the Catalyst identity
      # plane up in-process (local_identity.build_local_issuer) and drive the
      # app under starlette's TestClient, so the 200 and 403 paths the Robot
      # suite cannot reach are covered here instead.
      - name: inbound identity tests
        run: |
          cd agents/langgraph-identity && uv run --frozen --with pytest pytest -v
